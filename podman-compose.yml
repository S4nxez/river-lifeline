# Production stack (Raspberry Pi). Reads MYSQL_ROOT_PASSWORD from the .env next to this file.
# IMAGE_TAG selects the image version (default latest); the Release workflow deploys by commit SHA.
# CI and local full-stack runs layer compose.build.yml on top to build the images from source.
#
# The API serves, read-only, the files the processing pipeline writes (CONTRACTS.md 2). RIVER_DATA_HOST_DIR (in the
# .env) points at that folder; until processing writes real passes it defaults to the repository's fixtures.
services:
  mysql:
    image: docker.io/library/mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: NisarSar
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - NisarSar-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ghcr.io/s4nxez/hackathon-nisar-sar-change-detection-back:${IMAGE_TAG:-latest}
    # Bounded retries: a broken Flyway migration must not restart forever
    restart: on-failure:5
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/NisarSar
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_PROFILES_ACTIVE: spring
      RIVER_DATA_DIR: /data
      # /api/v1 serves the worker's results (MySQL and the rasters volume); "files" serves RIVER_DATA_DIR instead
      RIVER_SOURCE: ${RIVER_SOURCE:-pipeline}
      # The area /health and /meta describe; empty = the first one found
      DEFAULT_AOI: ${DEFAULT_AOI:-}
      # Worker pipeline (api/worker-api.md): the worker's shared secret, the Earthdata token that reads NISAR
      # products, and whether the backend runs its recurring work (pass search, gauge, staging)
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      PIPELINE_SCHEDULE: ${PIPELINE_SCHEDULE:-true}
    volumes:
      - ${RIVER_DATA_HOST_DIR:-./fixtures/data}:/data:ro,Z
      - rasters:/var/lib/river-lifeline/rasters
    networks:
      - NisarSar-net

  # Processing (worker/, api/worker-api.md): leases jobs from the backend's internal API, judges the passes and posts
  # the results back. Stateless: no volume. It needs the same WORKER_TOKEN as the backend (the .env).
  worker:
    image: ghcr.io/s4nxez/hackathon-nisar-sar-change-detection-worker:${IMAGE_TAG:-latest}
    # A backend that is down is waited for, not a crash; a restart only follows a crash (e.g. out of memory), and
    # the backend hands the job out again when its lease expires
    restart: always
    depends_on:
      - backend
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      BACKEND_URL: http://backend:8080
    networks:
      - NisarSar-net

  frontend:
    image: ghcr.io/s4nxez/hackathon-nisar-sar-change-detection-front:${IMAGE_TAG:-latest}
    restart: always
    networks:
      - NisarSar-net

  caddy:
    image: docker.io/library/caddy:2
    restart: always
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - NisarSar-net

volumes:
  mysql_data:
  rasters:
  caddy_data:
  caddy_config:

networks:
  NisarSar-net:
