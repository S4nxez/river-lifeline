# Production stack (Raspberry Pi).
# IMAGE_TAG selects the image version (default latest); the Release workflow deploys by commit SHA.
# CI and local full-stack runs layer compose.build.yml on top to build the images from source.
#
# The backend has no database: it serves, read-only, the files the processing pipeline writes (CONTRACTS.md 2).
# RIVER_DATA_HOST_DIR (in the .env next to this file) points at that folder; until processing writes real passes
# it defaults to the repository's hand-made fixtures. Every area is a folder aois/<id>/ inside it.
services:
  backend:
    image: ghcr.io/s4nxez/hackathon-nisar-sar-change-detection-back:${IMAGE_TAG:-latest}
    restart: on-failure:5
    environment:
      RIVER_DATA_DIR: /data
      # The area /health and /meta describe; empty = the first one found
      DEFAULT_AOI: ${DEFAULT_AOI:-}
    volumes:
      - ${RIVER_DATA_HOST_DIR:-./fixtures/data}:/data:ro,Z
    networks:
      - river-net

  frontend:
    image: ghcr.io/s4nxez/hackathon-nisar-sar-change-detection-front:${IMAGE_TAG:-latest}
    restart: always
    networks:
      - river-net

  caddy:
    image: docker.io/library/caddy:2
    restart: always
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - river-net

volumes:
  caddy_data:
  caddy_config:

networks:
  river-net:
