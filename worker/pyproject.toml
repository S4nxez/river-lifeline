[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worker"
version = "0.1.0"
description = "Processing worker: river connectivity from NISAR (Sentinel-1 cross-check) and drought forecasting"
requires-python = ">=3.12"
# Rasters arrive as raw arrays: numpy and scipy process them, pyproj reprojects them; no format library is needed
dependencies = ["numpy>=2.1,<3", "pyproj>=3.7,<4", "scipy>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.9"]

[project.scripts]
worker = "worker.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]
