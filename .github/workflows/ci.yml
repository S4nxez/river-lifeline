name: CI

# Every pull request, and the first stage of Release: compile, test and start the whole stack
# (built from this commit, same compose file as production) before anything is published.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: podman-compose.yml:compose.build.yml
      COMPOSE_PROJECT_NAME: ci
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, to diff the pull request against its base
          fetch-depth: 0

      # AGENTS.md: every change ships with unit tests
      - name: Pull request - code changes come with tests
        if: github.event_name == 'pull_request'
        run: scripts/check-tests-changed.sh "origin/${{ github.base_ref }}"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same pinned Prettier as the pre-commit hook: catches commits made without it (or with --no-verify)
      - name: Frontend - formatting
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx prettier --check .

      # The frontend ships native ES modules as-is: one syntax error blanks the whole page
      - name: Frontend - syntax check
        run: |
          rc=0
          for f in $(git ls-files 'frontend/*.js'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; rc=1; }
          done
          exit "$rc"

      # node:test + jsdom, with Leaflet, Chart.js and fetch faked (frontend/tests)
      - name: Frontend - unit tests
        working-directory: frontend
        run: npm test

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      # Ruff (formatting + lint) and pytest, architecture rules included (worker/tests/test_architecture.py)
      - name: Worker - formatting, lint and unit tests
        working-directory: worker
        run: |
          pip install -e ".[dev]"
          ruff format --check .
          ruff check .
          pytest

      # The Pi deploys with podman-compose, which expands variables unlike docker compose (used below); same version
      - name: Stack - podman-compose expands every variable
        run: |
          pip install podman-compose==1.3.0
          scripts/check-compose.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify also runs spotless:check, which fails on unformatted Java
      - name: Backend - build, test and formatting
        run: mvn -B -ntp -f server/pom.xml verify

      # Release builds the images from this jar instead of compiling again
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: server/target/*.jar
          retention-days: 1

      # The backend serves the repository's fixtures (fixtures/data), the default data folder of the compose file
      - name: Stack - start
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "MYSQL_ROOT_PASSWORD=$pw" > .env
          docker compose up -d --build

      - name: Stack - smoke test
        run: scripts/smoke.sh http://127.0.0.1:8091 180

      - name: Stack - logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color backend mysql
