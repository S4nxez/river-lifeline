spring.application.name=river-lifeline-server

# CONTRACTS.md section 3.4: PORT (default 8000), RIVER_DATA_DIR and CORS_ORIGINS
server.port=${PORT:8000}

# Root written by the processing pipeline. The default serves the repository's fixtures when the
# server runs from server/ (`mvn spring-boot:run`); the container sets RIVER_DATA_DIR=/data.
river.data-dir=${RIVER_DATA_DIR:../fixtures/data}
# Areas are never configured here: each one, with its coordinates and thresholds, is a folder
# aois/<id>/ that processing writes under RIVER_DATA_DIR. DEFAULT_AOI only picks the area that
# /health and /meta describe; empty = the first area found (alphabetical).
river.default-aoi-id=${DEFAULT_AOI:}
# How often, at most, the backend checks whether catalog.json changed (its mtime)
river.catalog-check-interval=60s
# Comma-separated front origins allowed by CORS; empty = same origin only (the app is served behind Caddy)
river.cors-origins=${CORS_ORIGINS:}

# JSON: snake_case keys, nulls always written (never omitted), ISO 8601 timestamps
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Unknown routes reach the exception handler instead of the HTML whitelabel page
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
