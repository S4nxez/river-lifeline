# Local development: run the backend from the IDE (or `mvn spring-boot:run` in server/) and this around it.
#   docker compose -f compose.dev.yml up -d      (podman-compose works too)
#   docker compose -f compose.dev.yml down
#
#   front -> http://localhost:5500, the frontend from disk with /api proxied to the backend (Caddyfile.dev).
#            BACKEND=host:port points it elsewhere (default: the host's port 8000)
# The backend needs no database: run from server/, it serves ../fixtures/data (RIVER_DATA_DIR overrides it).
services:
  front:
    image: docker.io/library/caddy:2
    environment:
      BACKEND: ${BACKEND:-host.docker.internal:8000}
    # Docker Desktop and Podman resolve host.docker.internal already; Docker Engine on Linux needs this
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5500:80"
    volumes:
      - ./frontend:/srv:ro,Z
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro,Z
